<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AIEC Redirecting...</title>
<script>
  fetch('target.txt?t=' + Date.now())
    .then(r => r.text())
    .then(url => {
      url = url.trim();
      if (url) window.location.replace(url);
      else document.body.innerText = 'target.txt is empty.';
    })
    .catch(() => { document.body.innerText = 'Failed to load target.'; });
</script>
</head>
<body>
<p>Redirecting to the current AIEC site...</p>
</body>
</html>
